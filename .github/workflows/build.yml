name: Build Chawan .deb for Termux

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build Chawan .deb inside Termux Docker
        run: |
          docker pull termux/termux-docker:aarch64
          docker run --rm -v ${{ github.workspace }}:/out termux/termux-docker:aarch64 bash -c "
            set -e
            pkg update -y
            pkg install -y nim git make pkg-config openssl libssh2 libbrotli ncurses dpkg libandroid-glob

            git clone https://git.sr.ht/~bptato/chawan /tmp/chawan
            cd /tmp/chawan
            make -j4 PREFIX=/data/data/com.termux/files/usr
            make install PREFIX=/data/data/com.termux/files/usr DESTDIR=/tmp/staging

            mkdir -p /tmp/staging/DEBIAN
            cat > /tmp/staging/DEBIAN/control <<'EOF'
          Package: chawan
          Version: 0.5.3
          Architecture: aarch64
          Maintainer: Francisco <francisco@localhost>
          Section: net
          Priority: optional
          Depends: openssl, libssh2, libbrotli, ncurses, libandroid-glob
          Description: TUI web browser
           Chawan is a text-mode web browser and pager for Unix-like systems,
           with CSS, some JS support, and inline images.
          EOF

            dpkg-deb --build /tmp/staging /out/chawan_0.5.3_aarch64.deb
            ls -lh /out/
            dpkg-deb --info /out/chawan_0.5.3_aarch64.deb
          "

      - uses: actions/upload-artifact@v4
        with:
          name: chawan-termux-aarch64-deb
          path: chawan_0.5.3_aarch64.deb
          if-no-files-found: error
