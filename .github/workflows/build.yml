name: Build Chawan .deb for Termux

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build Chawan .deb inside Termux Docker
        run: |
          docker pull termux/termux-docker:aarch64
          docker run --rm -v ${{ github.workspace }}:/data/data/com.termux/files/usr/tmp/out termux/termux-docker:aarch64 bash -c "
            set -e
            export TTMP=/data/data/com.termux/files/usr/tmp
            mkdir -p \$TTMP \$TTMP/out
            pkg update -y
            pkg install -y nim git make pkg-config openssl libssh2 brotli ncurses dpkg libandroid-glob file

            git clone https://git.sr.ht/~bptato/chawan \$TTMP/chawan
            cd \$TTMP/chawan

            sed -i 's|lib/chaseccomp/chaseccomp.o||g' Makefile

            make -j1 DANGER_DISABLE_SANDBOX=1 PREFIX=/data/data/com.termux/files/usr
            make install DANGER_DISABLE_SANDBOX=1 PREFIX=/data/data/com.termux/files/usr DESTDIR=\$TTMP/staging

            mkdir -p \$TTMP/staging/DEBIAN
            cat > \$TTMP/staging/DEBIAN/control <<'EOF'
          Package: chawan
          Version: 0.5.3
          Architecture: aarch64
          Maintainer: Francisco <francisco@localhost>
          Section: net
          Priority: optional
          Depends: openssl, libssh2, brotli, ncurses, libandroid-glob
          Description: TUI web browser
           Chawan is a text-mode web browser and pager for Unix-like systems,
           with CSS, some JS support, and inline images.
          EOF

            dpkg-deb --build \$TTMP/staging \$TTMP/out/chawan_0.5.3_aarch64.deb
            ls -lh \$TTMP/out/
            dpkg-deb --info \$TTMP/out/chawan_0.5.3_aarch64.deb
          "

      - uses: actions/upload-artifact@v4
        with:
          name: chawan-termux-aarch64-deb
          path: chawan_0.5.3_aarch64.deb
          if-no-files-found: error
